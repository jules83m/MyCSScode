<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
  <div class="container my-5">
    <div class="border border-3 rounded p-4 shadow-sm">
      <h1 class="display-1 text-center text-danger">LOST: Ark of the Covenant</h1>
      

      
      <div id="lostCarousel" class="carousel slide my-4" data-bs-ride="carousel">
        <div class="carousel-indicators">
          <button type="button" data-bs-target="#lostCarousel" data-bs-slide-to="0" class="active" aria-current="true" aria-label="Slide 1"></button>
          <button type="button" data-bs-target="#lostCarousel" data-bs-slide-to="1" aria-label="Slide 2"></button>
          <button type="button" data-bs-target="#lostCarousel" data-bs-slide-to="2" aria-label="Slide 3"></button>
        </div>
        <div class="carousel-inner">
          <div class="carousel-item active">
            <img src="https://anetoday.org/wp-content/uploads/2025/09/McGeough_Fig1.jpg" class="d-block w-100" alt="Arc - Livescience">
          </div>
          <div class="carousel-item">
            <img src="https://www.worldhistory.org/img/c/p/1600x900/14382.jpg" class="d-block w-100" alt="Arc - WorldHistory">
          </div>
          <div class="carousel-item">
            <img src="https://www.immanuel-tours.com/wp-content/uploads/2025/08/Screenshot-2025-08-19-at-11.40.45.png" class="d-block w-100" alt="Arc - Immanuel Tours">
          </div>
        </div>
        <button class="carousel-control-prev" type="button" data-bs-target="#lostCarousel" data-bs-slide="prev">
          <span class="carousel-control-prev-icon" aria-hidden="true"></span>
          <span class="visually-hidden">Previous</span>
        </button>
        <button class="carousel-control-next" type="button" data-bs-target="#lostCarousel" data-bs-slide="next">
          <span class="carousel-control-next-icon" aria-hidden="true"></span>
          <span class="visually-hidden">Next</span>
        </button>
      </div>

     
      <div class="d-flex justify-content-center gap-3 my-3">
        <a href="julesprofile.html" class="btn btn-primary btn-lg active" role="button" aria-pressed="true">Who I am</a>
        <a href="https://www.example.com" class="btn btn-secondary btn-sm disabled" tabindex="-1" aria-disabled="true">Claim Reward (disabled)</a>
      </div>

      
      <form class="needs-validation p-3 bg-light rounded" novalidate>
        <div class="mb-3">
          <label for="name" class="form-label">Your name</label>
          <input type="text" class="form-control" id="name" placeholder="Johnathan Chen" required>
        </div>

        <div class="mb-3">
          <label for="email" class="form-label">Email address</label>
          <input type="email" class="form-control" id="email" placeholder="you@example.com" required>
        </div>

        <div class="mb-3">
          <label class="form-label">Which image matches the sighting?</label>
          <select class="form-select" aria-label="image select">
            <option selected>Choose an image</option>
            <option value="1">1</option>
            <option value="2">2</option>
            <option value="3">3</option>
          </select>
        </div>

        <div class="mb-3 form-check">
          <input type="checkbox" class="form-check-input" id="seen">
          <label class="form-check-label" for="seen">I actually saw the lost ark</label>
        </div>

        <div class="mb-3">
          <label for="photo" class="form-label">Upload a photo </label>
          <input class="form-control" type="file" id="photo">
        </div>

        <button type="submit" class="btn btn-success">Submit Sighting</button>
      </form>

     
    </div>
  </div>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

</body>
</html>
