<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>bootstrap columns</title>
     <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
    <h1 class="text-center my-4">Which ___ am I?</h1>
    <div class="container text-center">
      <div class="row g-4">
        <div class="col-12 col-sm-6 col-md-4">
          <div class="card h-100">
            <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/9/99/Pinus_jeffreyi_LassenCA.jpg/250px-Pinus_jeffreyi_LassenCA.jpg" class="card-img-top" alt="Pine Tree">
            <div class="card-body">
              <h5 class="card-title">Tree</h5>
              <p class="card-text">I am a Pine Tree</p>
            </div>
          </div>
        </div>

        <div class="col-12 col-sm-6 col-md-4">
          <div class="card h-100">
            <img src="https://ssb.wiki.gallery/images/6/6d/Luigi.png" class="card-img-top" alt="Luigi">
            <div class="card-body">
              <h5 class="card-title">Mario Character</h5>
              <p class="card-text">I am Luigi</p>
            </div>
          </div>
        </div>

        <div class="col-12 col-sm-6 col-md-4">
          <div class="card h-100">
            <img src="https://www.pokemon.com/static-assets/content-assets/cms2/img/pokedex/full/633.png" class="card-img-top" alt="Deino">
            <div class="card-body">
              <h5 class="card-title">Pokemon</h5>
              <p class="card-text">I am Deino</p>
            </div>
          </div>
        </div>

    
            <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

</body>
</html>
